    - data:
        code: "import json\n\ndef extract_items(arg):\n    \"\"\"\n    Extracts the\
          \ 'data' items from SQL output.\n    Handles strings, lists, dicts, and\
          \ metadata.\n    \"\"\"\n    if arg is None:\n        return []\n\n    #\
          \ Convert raw value (string, list, dict) to Python\n    if isinstance(arg,\
          \ str):\n        arg = arg.strip()\n        if arg == \"\" or arg == \"\
          []\":\n            return []\n        try:\n            # Remove outer []\
          \ to make valid JSON if necessary\n            if arg.startswith(\"[\")\
          \ and arg.endswith(\"]\"):\n                parsed = json.loads(arg)\n \
          \           else:\n                parsed = json.loads(f\"[{arg}]\")\n \
          \       except:\n            return []\n    else:\n        parsed = arg\n\
          \n    # Case 1 — List result from SQL\n    if isinstance(parsed, list):\n\
          \        cleaned = []\n        for row in parsed:\n            if isinstance(row,\
          \ dict) and \"data\" in row:\n                # Dify SQL structure\n   \
          \             cleaned.extend(row[\"data\"])\n            else:\n       \
          \         cleaned.append(row)\n        return cleaned\n\n    # Case 2 —\
          \ Dict result\n    if isinstance(parsed, dict):\n        if \"data\" in\
          \ parsed:\n            return parsed[\"data\"]\n        else:\n        \
          \    return [parsed]\n\n    return []\n    \n\ndef main(arg1, arg2, arg3):\n\
          \n    # Extract real SQL rows\n    rows1 = extract_items(arg1)\n    rows2\
          \ = extract_items(arg2)\n    rows3 = extract_items(arg3)\n\n    # Merge\
          \ results\n    all_rows = rows1 + rows2 + rows3\n\n    # If user has NO\
          \ access → results empty\n    if len(all_rows) == 0:\n        return {\n\
          \            \"result\": \"Access Denied: You do not have permission to\
          \ access this data.\"\n        }\n\n    # Return cleaned JSON for the LLM\n\
          \    return {\"result\": json.dumps(all_rows)}\n"
