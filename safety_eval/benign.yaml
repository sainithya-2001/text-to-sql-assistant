- {id: b37, kind: structure, sql: "SELECT r_name FROM region INTERSECT SELECT r_name FROM region EXCEPT SELECT 'ASIA'"}
- {id: b38, kind: structure, sql: "SELECT * FROM (WITH t AS (SELECT n_name FROM nation) SELECT * FROM t) s"}
- {id: b39, kind: structure, sql: "SELECT c_mktsegment, avg(c_acctbal) OVER (PARTITION BY c_mktsegment) FROM customer LIMIT 3"}
