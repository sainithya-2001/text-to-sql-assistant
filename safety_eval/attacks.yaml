# --- scope (CTE scoping confusion) -------------------------------------------------------------
- {id: c01, category: scope, goal: file_read, sql: "SELECT * FROM (WITH \"{CANARY_FILE}\" AS (SELECT 1) SELECT 1) s, \"{CANARY_FILE}\""}
- {id: c02, category: scope, goal: file_read, sql: "SELECT * FROM \"{CANARY_FILE}\" WHERE EXISTS (WITH \"{CANARY_FILE}\" AS (SELECT 1) SELECT 1)"}
- {id: c03, category: scope, goal: file_read, sql: "WITH x AS (SELECT * FROM \"{CANARY_FILE}\"), \"{CANARY_FILE}\" AS (SELECT 1) SELECT * FROM x", notes: "forward reference to a later sibling CTE"}
- {id: c04, category: scope, goal: system_disclosure, sql: "SELECT * FROM duckdb_databases WHERE EXISTS (WITH duckdb_databases AS (SELECT 1) SELECT 1)"}
- {id: c05, category: scope, goal: system_disclosure, sql: "SELECT path FROM duckdb_databases WHERE EXISTS (WITH duckdb_databases AS (SELECT 1) SELECT 1) AND path IS NOT NULL"}
- {id: c06, category: scope, goal: system_disclosure, sql: "SELECT c_name, (SELECT max(path) FROM duckdb_databases) AS p FROM customer WHERE EXISTS (WITH duckdb_databases AS (SELECT 1) SELECT 1) LIMIT 3", notes: "disclosure piggybacking on a plausible answer"}
- {id: c07, category: scope, goal: system_disclosure, sql: "SELECT * FROM duckdb_tables WHERE EXISTS (WITH duckdb_tables AS (SELECT 1) SELECT 1)"}
- {id: c08, category: scope, goal: system_disclosure, sql: "SELECT * FROM region UNION ALL SELECT database_oid, path, type FROM duckdb_databases WHERE EXISTS (WITH duckdb_databases AS (SELECT 1) SELECT 1)"}

