# Ambiguity handling. Items with expect_clarification: true score correct only if the assistant asks a
# clarifying question instead of answering. The others contain a cue that settles the meaning, so the
# assistant should answer (and match the gold result) without asking.

- id: a01
  difficulty: medium
  category: ambiguous
  question: Who are our biggest customers?
  expect_clarification: true

- id: a02
